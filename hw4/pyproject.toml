[project]
name = "hw4-security-triage"
version = "0.1.0"
description = "MCP advisory triage agent for FAU Security Engineering"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mcp>=1.28,<2",
  "mcp-server-fetch==2025.4.7",
  "openai>=2,<3",
  "packaging>=24",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
